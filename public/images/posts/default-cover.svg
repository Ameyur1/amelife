<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Amelife 默认文章封面</title>
  <desc id="desc">深蓝色渐变背景、柔和波浪与字母 A</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a263d"/>
      <stop offset="1" stop-color="#164865"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3a45f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f6c795" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1320" cy="170" r="260" fill="#ffffff" opacity=".035"/>
  <circle cx="1280" cy="190" r="150" fill="#ffffff" opacity=".04"/>
  <path d="M0 650C240 520 390 790 660 650S1090 480 1600 700V900H0Z" fill="#2d6f8f" opacity=".72"/>
  <path d="M0 720C300 590 460 850 760 700S1200 590 1600 770V900H0Z" fill="url(#wave)" opacity=".7"/>
  <circle cx="800" cy="420" r="150" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="3"/>
  <text x="800" y="505" fill="#ffffff" font-family="Georgia, serif" font-size="250" text-anchor="middle">A</text>
  <text x="800" y="740" fill="#ffffff" fill-opacity=".72" font-family="Arial, sans-serif" font-size="34" letter-spacing="12" text-anchor="middle">AMELIFE</text>
</svg>
